name: Release SDK

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate release tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          package_version="$(python -c 'from pathlib import Path; namespace = {}; exec(Path("src/vigil/_version.py").read_text(encoding="utf-8"), namespace); print(namespace["__version__"])')"

          if [ "$version" != "$package_version" ]; then
            echo "Tag $tag does not match package version $package_version" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,release]"

      - name: Run tests
        run: pytest -m "not integration and not performance" -v

      - name: Run linters
        run: |
          mypy --strict src/vigil/
          ruff check src/vigil/ tests/

      - name: Audit dependencies
        run: pip-audit

      - name: Build package
        run: python -m build

      - name: Generate SBOM
        run: cyclonedx-py environment -o sbom.json

      - name: Import GPG key
        if: env.HAS_GPG_KEY == 'true'
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Sign distribution files
        if: env.HAS_GPG_KEY == 'true'
        run: |
          for file in dist/*; do
            gpg --batch --yes --armor --detach-sign "$file"
          done

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp dist/*.tar.gz dist/*.whl release-assets/
          if compgen -G "dist/*.asc" > /dev/null; then
            cp dist/*.asc release-assets/
          fi
          cp sbom.json release-assets/

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: |
            dist/*.tar.gz
            dist/*.whl

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
          body: |
            Vigil Guard Python SDK ${{ steps.version.outputs.package_version }} for the Vigil Guard 1.8.x API contract.

            ## Installation
            ```bash
            pip install "vigil-guard @ git+https://github.com/Vigil-Guard/vge-python-sdk.git@${{ steps.version.outputs.tag }}"
            ```

            If this release is published to PyPI:

            ```bash
            pip install vigil-guard==${{ steps.version.outputs.package_version }}
            ```

            ## Migration from 1.x

            SDK 2.0 accepts anti-recon opaque responses. Check
            `result.diagnostics_available` before reading diagnostic fields or
            compare optional diagnostic properties explicitly, such as
            `result.is_high_risk is True`.

            Before rolling a consumer back to SDK 1.x, disable opaque exposure
            for that consumer's affected rule sets. A 1.x parser rejects opaque
            responses, so use a forward fix when that cannot be guaranteed.

            See `CHANGELOG.md` in this release for the complete migration notes.

            ## Verification
            SBOM is included in release assets. GPG signatures are included when the release signing key is configured.

  publish-pypi:
    needs: release
    if: vars.PYPI_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
